server {
    listen 3000;
    server_name raspberrypi.taild65009.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name raspberrypi.taild65009.ts.net;

    ssl_certificate     /etc/ssl/tailscale/raspberrypi.taild65009.ts.net.crt;
    ssl_certificate_key /etc/ssl/tailscale/raspberrypi.taild65009.ts.net.key;

    # Proxy /api/ requests to FastAPI, stripping the /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the built React frontend, with SPA fallback
    location / {
        root /home/michael/rubricgrader/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        root /home/michael/rubricgrader/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
